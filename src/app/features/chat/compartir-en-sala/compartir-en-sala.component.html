<dialog #dialog class="csala" (click)="alPulsarElVelo($event)" (close)="cerrado.emit()">
  <div class="csala__panel">
    <header class="csala__cab">
      <div>
        <h2>{{ 'chat.compartirEnSala' | t }}</h2>
        @if (que(); as q) {
          <p>{{ q.titulo }}</p>
        }
      </div>

      <button
        type="button"
        class="csala__cerrar"
        [attr.aria-label]="'comun.cerrar' | t"
        [disabled]="!!enviandoA()"
        (click)="cerrar()"
      >
        <vt-icon name="close" [size]="18" />
      </button>
    </header>

    @if (cargando()) {
      <p class="csala__nada">{{ 'chat.buscandoSalas' | t }}</p>
    } @else if (error()) {
      <div class="csala__nada">
        <p>{{ error() }}</p>
        <button type="button" class="csala__reintentar" (click)="traerSalas()">{{ 'comun.reintentar' | t }}</button>
      </div>
    } @else {
      <ul class="csala__lista">
        @for (sala of salas(); track sala.id) {
          <li>
            <button
              type="button"
              class="csala__sala"
              [disabled]="!!enviandoA()"
              (click)="elegir(sala)"
            >
              <span class="csala__bola" aria-hidden="true">{{ inicialDe(sala.nombre) }}</span>

              <span class="csala__texto">
                <span class="csala__nombre">{{ sala.nombre }}</span>
                <span class="csala__pie">{{ 'chat.personas' | t: { n: sala.miembros } }}</span>
              </span>

              @if (enviandoA() === sala.nombre) {
                <span class="csala__yendo">{{ 'chat.enviando' | t }}</span>
              } @else {
                <vt-icon name="send" [size]="17" />
              }
            </button>
          </li>
        } @empty {
          <!-- No es un error: es que nadie te ha metido en ninguna. Y se dice
               quién puede hacerlo, porque ante una lista vacía lo primero que
               se piensa es que la aplicación no cargó. -->
          <li class="csala__nada">
            {{ 'chat.ningunaSala' | t }}
          </li>
        }
      </ul>
    }
  </div>
</dialog>
