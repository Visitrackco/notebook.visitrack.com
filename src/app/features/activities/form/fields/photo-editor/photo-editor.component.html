<div class="pedit">
  <header class="pedit__bar">
    <button type="button" class="pedit__close" (click)="close()" [attr.aria-label]="'campo.cerrarSinGuardar' | t">
      <vt-icon name="close" [size]="20" />
    </button>

    <span class="pedit__title">{{ 'campo.editarFoto' | t }}</span>

    <button type="button" class="pedit__save" [disabled]="saving()" (click)="exportImage()">
      <vt-icon name="check" [size]="17" />
      {{ (saving() ? 'form.guardando' : 'comun.guardar') | t }}
    </button>
  </header>

  <!-- El lienzo se escala para caber; los trazos se guardan en coordenadas de
       la imagen, así que no se desplazan al cambiar el tamaño de la ventana. -->
  <div class="pedit__stage">
    <canvas
      #canvas
      class="pedit__canvas"
      [class.pedit__canvas--crop]="tool() === 'crop'"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp()"
      (pointercancel)="onPointerUp()"
    ></canvas>
  </div>

  <footer class="pedit__tools">
    <!-- ── Herramienta ─────────────────────────────────────────────────── -->
    <div class="pedit__group">
      <button
        type="button"
        class="pedit__tool"
        [class.pedit__tool--on]="tool() === 'draw'"
        (click)="setTool('draw')"
        [title]="'campo.dibujar' | t"
      >
        <vt-icon name="clipboard" [size]="18" />
        <span>{{ 'campo.dibujar' | t }}</span>
      </button>
      <button
        type="button"
        class="pedit__tool"
        [class.pedit__tool--on]="tool() === 'crop'"
        (click)="setTool('crop')"
        [title]="'campo.recortar' | t"
      >
        <vt-icon name="box" [size]="18" />
        <span>{{ 'campo.recortar' | t }}</span>
      </button>
      <button type="button" class="pedit__tool" (click)="rotate()" [title]="'campo.girar90' | t">
        <vt-icon name="refresh" [size]="18" />
        <span>{{ 'campo.girar' | t }}</span>
      </button>
    </div>

    <!-- ── Trazo ───────────────────────────────────────────────────────── -->
    @if (tool() === 'draw') {
      <div class="pedit__group pedit__group--colors">
        @for (value of colors; track value) {
          <button
            type="button"
            class="pedit__color"
            [class.pedit__color--on]="color() === value"
            [style.background]="value"
            (click)="color.set(value)"
            [attr.aria-label]="'Color ' + value"
          ></button>
        }
      </div>

      <div class="pedit__group">
        @for (value of widths; track value) {
          <button
            type="button"
            class="pedit__width"
            [class.pedit__width--on]="width() === value"
            (click)="width.set(value)"
            [attr.aria-label]="'Grosor ' + value"
          >
            <span [style.width.px]="value" [style.height.px]="value"></span>
          </button>
        }
      </div>

      <div class="pedit__group">
        <button type="button" class="pedit__tool" [disabled]="!canUndo()" (click)="undo()">
          <vt-icon name="chevron" [size]="17" class="pedit__undo-icon" />
          <span>{{ 'campo.deshacer' | t }}</span>
        </button>
        <button type="button" class="pedit__tool" [disabled]="!canUndo()" (click)="clearStrokes()">
          <vt-icon name="trash" [size]="17" />
          <span>{{ 'campo.limpiar' | t }}</span>
        </button>
      </div>
    }

    <!-- ── Recorte ─────────────────────────────────────────────────────── -->
    @if (tool() === 'crop') {
      <div class="pedit__group">
        <span class="pedit__hint">{{ 'campo.arrastraArea' | t }}</span>
        <button type="button" class="pedit__tool pedit__tool--primary" (click)="applyCrop()">
          <vt-icon name="check" [size]="17" />
          <span>{{ 'campo.aplicar' | t }}</span>
        </button>
        @if (hasCrop()) {
          <button type="button" class="pedit__tool" (click)="resetCrop()">
            <vt-icon name="refresh" [size]="17" />
            <span>{{ 'campo.fotoCompleta' | t }}</span>
          </button>
        }
      </div>
    }
  </footer>
</div>

<vt-confirm-dialog
  [open]="askingDiscard()"
  tone="warning"
  icon="alert"
  [title]="'campo.hayDibujos' | t"
  [message]="'campo.hayDibujosMensaje' | t"
  [confirmLabel]="'comun.continuar' | t"
  [cancelLabel]="'comun.cancelar' | t"
  (confirm)="confirmDiscard()"
  (cancel)="cancelDiscard()"
/>
