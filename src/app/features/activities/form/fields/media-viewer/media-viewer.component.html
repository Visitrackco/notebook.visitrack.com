<div class="viewer" tabindex="-1" (keydown)="onKeydown($event)">
  <header class="viewer__bar">
    <button type="button" class="viewer__icon" (click)="close.emit()" aria-label="Cerrar">
      <vt-icon name="close" [size]="20" />
    </button>

    <div class="viewer__titles">
      @if (title()) {
        <strong>{{ title() }}</strong>
      }
      @if (caption()) {
        <small>{{ caption() }}</small>
      }
    </div>

    <button type="button" class="viewer__icon" (click)="download.emit()" title="Descargar">
      <vt-icon name="download" [size]="19" />
    </button>
  </header>

  @if (isImage()) {
    <div
      #stage
      class="viewer__stage viewer__stage--grab"
      [class.viewer__stage--white]="onWhite()"
      (wheel)="onWheel($event)"
      (dblclick)="onDoubleClick($event)"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerUp($event)"
    >
      <img
        #media
        class="viewer__media"
        [src]="src()"
        [alt]="title()"
        [style.transform]="transform()"
        draggable="false"
      />
    </div>
  } @else {
    <!--
      El video va en su propio contenedor, sin los manejadores del zoom.

      Compartiendo el de la imagen heredaba `touch-action: none` —que deja los
      controles nativos sin responder al tacto— y sus escuchas de puntero, que
      se quedaban con los gestos antes de que llegaran a la barra de
      reproducción. El reproductor estaba, pero no había forma de usarlo.
    -->
    <div class="viewer__stage viewer__stage--video">
      <video
        class="viewer__player"
        [src]="src()"
        controls
        controlsList="nodownload"
        preload="metadata"
        playsinline
      ></video>
    </div>
  }

  @if (isImage()) {
    <footer class="viewer__foot">
      <button type="button" class="viewer__zoom" (click)="step(1 / 1.4)" aria-label="Reducir">
        <span aria-hidden="true">−</span>
      </button>

      <button type="button" class="viewer__level" (click)="reset()" title="Tamaño original">
        {{ percent() }}
      </button>

      <button type="button" class="viewer__zoom" (click)="step(1.4)" aria-label="Ampliar">
        <span aria-hidden="true">+</span>
      </button>

      <!-- Aparece solo cuando hay algo que deshacer: es la salida de un encuadre
           en el que uno se perdió. -->
      @if (moved()) {
        <button type="button" class="viewer__center" (click)="reset()">
          <vt-icon name="refresh" [size]="15" />
          Centrar
        </button>
      }
    </footer>

    @if (!moved()) {
      <p class="viewer__hint">Arrastra para desplazar · doble clic o pellizco para ampliar</p>
    }
  }
</div>
