<div class="cam">
  <header class="cam__bar">
    <button type="button" class="cam__close" (click)="close()" aria-label="Cerrar">
      <vt-icon name="close" [size]="20" />
    </button>
    <span class="cam__title">Tomar fotografía</span>
    @if (hasMultipleCameras()) {
      <button type="button" class="cam__flip" (click)="flip()" aria-label="Cambiar de cámara">
        <vt-icon name="refresh" [size]="18" />
      </button>
    }
  </header>

  <div class="cam__stage">
    @if (error()) {
      <div class="cam__error">
        <vt-icon name="alert" [size]="30" />
        <p>{{ error() }}</p>
      </div>
    }
    <video #video class="cam__video" [class.cam__video--mirror]="facing() === 'user'" playsinline muted></video>
  </div>

  <footer class="cam__tools">
    <button
      type="button"
      class="cam__shoot"
      [disabled]="!ready()"
      (click)="shoot()"
      aria-label="Capturar"
    >
      <span class="cam__shoot-ring"></span>
    </button>
  </footer>
</div>
