<!-- El resultado se lee como un dato, no como un campo que espera algo: sin
     recuadro de entrada ni cursor, porque no hay nada que teclear aquí. -->
<div class="calc" [class.calc--empty]="empty()" [class.calc--invalid]="invalid()">
  <span class="calc__icon">
    <vt-icon [name]="icon()" [size]="18" />
  </span>

  <div class="calc__body">
    <p class="calc__value">
      <span class="vt-figure">{{ display() }}</span>
      @if (unit()) {
        <em>{{ unit() }}</em>
      }
    </p>

    <!-- De dónde sale el número. Un total sin origen invita a dudar de él, y la
         duda acaba en una llamada preguntando si está bien. -->
    <small class="calc__origin">
      {{ empty() ? reason() : origin() }}
    </small>
  </div>

  <span class="calc__auto" title="Se actualiza solo">
    <vt-icon name="refresh" [size]="14" />
  </span>
</div>

@if (field().hel) {
  <small class="calc__help">{{ field().hel }}</small>
}

@if (invalid()) {
  <small class="calc__error">Este campo es obligatorio y todavía no tiene valor.</small>
}
