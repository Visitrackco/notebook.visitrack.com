<!-- Una sola línea: bolita, nombre y el gesto de abrir. El rótulo «Estado de
     la actividad» sobraba —lo dice la bolita de color, que es justo el lenguaje
     que cada cliente configuró— y obligaba a dos líneas de alto en una barra
     que está fija en pantalla todo el rato. -->
<button type="button" class="statusbar" [style.--status]="color()" (click)="toggle()">
  <span class="statusbar__dot" aria-hidden="true"></span>
  <span class="statusbar__value">{{ selected()?.Name || 'Sin estado' }}</span>
  <vt-icon name="chevron" [size]="15" />
</button>

<dialog #dialog class="statuspick" (click)="onBackdropClick($event)" (close)="close()">
  <div class="statuspick__panel">
    <header class="statuspick__header">
      <div>
        <h2>Estado de la actividad</h2>
        <p>Define cómo llega a Visitrack y quién la ve.</p>
      </div>
      <button type="button" class="statuspick__close" (click)="close()" aria-label="Cerrar">
        <vt-icon name="close" [size]="18" />
      </button>
    </header>

    @if (searchable()) {
      <label class="statuspick__search">
        <vt-icon name="clipboard" [size]="16" />
        <input
          type="search"
          [value]="term()"
          (input)="onSearch($event)"
          placeholder="Buscar estado"
          autocomplete="off"
        />
      </label>
    }

    <ul class="statuspick__list">
      @for (status of visible(); track status.ID) {
        <li>
          <button
            type="button"
            class="statuspick__option"
            [class.statuspick__option--current]="isCurrent(status)"
            [style.--status]="colorOf(status)"
            (click)="choose(status)"
          >
            <span class="statuspick__dot" aria-hidden="true"></span>
            <span class="statuspick__name">{{ status.Name }}</span>
            @if (status.IsCompleted === 1) {
              <span class="statuspick__tag">Cierra la actividad</span>
            }
            @if (isCurrent(status)) {
              <vt-icon name="check" [size]="17" />
            }
          </button>
        </li>
      }

      @if (visible().length === 0) {
        <li class="statuspick__empty">Ningún estado coincide con «{{ term() }}».</li>
      }

      <!-- «Sin estado» no se filtra: es la forma de deshacer una elección, y
           tener que borrar la búsqueda para llegar a ella sería absurdo. -->
      <li>
        <button
          type="button"
          class="statuspick__option statuspick__option--none"
          [class.statuspick__option--current]="!current()"
          (click)="choose(null)"
        >
          <span class="statuspick__dot" aria-hidden="true"></span>
          <span class="statuspick__name">Sin estado</span>
          @if (!current()) {
            <vt-icon name="check" [size]="17" />
          }
        </button>
      </li>
    </ul>
  </div>
</dialog>
