<section class="load">
  <div class="load__brand">
    <span class="load__mark"><vt-icon name="clipboard" [size]="30" /></span>
    <h1>Preparando tus datos</h1>
  </div>

  @if (failed()) {
    <div class="load__failed">
      <span class="load__failed-icon"><vt-icon name="alert" [size]="24" /></span>
      <p>{{ failed() }}</p>

      <div class="load__actions">
        <button type="button" class="load__retry" (click)="retry()">Reintentar</button>
        <button type="button" class="load__skip" (click)="enter()">Entrar de todos modos</button>
      </div>
    </div>
  } @else {
    <!-- Con valor real cuando el servidor dijo cuántos registros vienen, y
         girando mientras todavía no lo ha dicho. Una barra que avanza sin saber
         cuánto falta hace que una primera descarga larga se sienta rota. -->
    @if (progress() > 0) {
      <div
        class="load__bar"
        role="progressbar"
        [attr.aria-valuenow]="progress() * 100"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <span [style.width.%]="progress() * 100"></span>
      </div>
    } @else {
      <div class="load__bar load__bar--waiting"><span></span></div>
    }

    <p class="load__message">{{ sync.state().message || 'Conectando…' }}</p>

    @if (counter()) {
      <p class="load__counter vt-figure">{{ counter() }}</p>
    }

    <!-- Qué está entrando. Una espera con contenido se lleva mejor que una
         barra muda, y de paso explica por qué la primera vez tarda. -->
    @if (detail()) {
      <p class="load__detail">{{ detail() }}</p>
    }

    <p class="load__note">
      Solo se trae lo que cambió. La primera vez es la más larga.
    </p>
  }
</section>
